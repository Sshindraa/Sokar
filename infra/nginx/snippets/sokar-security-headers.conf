# En-têtes de sécurité communs. nginx n'hérite pas des add_header du serveur dans un bloc
# location qui déclare les siens : chaque location avec add_header doit inclure ce fichier.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
