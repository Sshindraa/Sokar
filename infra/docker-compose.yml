# ── Sokar Infra Stack ───────────────────────────────────────────────────────
# PostgreSQL + Redis via Docker
# API et Dashboard tournent directement via PM2 (build natif sur le VPS)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sokar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      POSTGRES_DB: sokar
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sokar']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  localstack:
    image: localstack/localstack:4.2
    ports:
      - '127.0.0.1:4566:4566'
    environment:
      - SERVICES=s3,sqs,ses,lambda,cloudwatch,secretsmanager
      - AWS_DEFAULT_REGION=eu-west-1
      - DEBUG=${LOCALSTACK_DEBUG:-0}
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Observabilité (R1-6) ─────────────────────────────────────────
  # `network_mode: host` est volontaire : Prometheus doit atteindre l'API et le
  # process worker sur la loopback (127.0.0.1:4000 et :4001), ce que la garde
  # `/metrics` accepte sans secret supplémentaire. Grafana écoute sur 3030 et
  # reste lié à la loopback : l'accès se fait par tunnel SSH, pas par Nginx.
  prometheus:
    image: prom/prometheus:v3.1.0
    network_mode: host
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.listen-address=127.0.0.1:9090'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: '127.0.0.1'
      GF_SERVER_HTTP_PORT: '3030'
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD requis}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  pgdata:
  redis-data:
  localstack-data:
  prometheus-data:
  grafana-data:
