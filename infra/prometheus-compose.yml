# Production Prometheus runs separately from the local-dev infrastructure stack.
# Host networking lets it scrape the loopback-only prod/staging API processes;
# its query endpoint remains bound to loopback.
services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: sokar-prometheus
    network_mode: host
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.listen-address=127.0.0.1:9090'
    restart: unless-stopped

volumes:
  prometheus-data:
