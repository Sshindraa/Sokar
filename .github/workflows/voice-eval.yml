name: Voice eval

# Banc d'évaluation vocal (phase 4) : un LLM joue l'appelant contre le vrai
# pipeline de l'agent, un autre note le naturel. Appels Groq réels, sur une
# clé dédiée (secret VOICE_EVAL_GROQ_API_KEY) pour ne jamais partager les
# limites de débit de la production.
# - Nuit : les 50 scénarios. PR : sous-ensemble rapide (~10).
# - Bloquant : 0 erreur critique (réservation avec date, heure ou nombre faux).
#   Le seuil de réussite ne bloque qu'une fois calibré (min_pass_rate).
on:
  schedule:
    # Chaque nuit à 2 h UTC.
    - cron: '0 2 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/src/modules/voice/**'
      - '.github/workflows/voice-eval.yml'
  workflow_dispatch:
    inputs:
      filter:
        description: 'Sous-chaîne d’identifiant ou de catégorie de scénario (vide = tous)'
        required: false
        default: ''
      repeat:
        description: 'Passages par scénario (calibrage : 3)'
        required: false
        default: '1'
      min_pass_rate:
        description: 'Seuil de réussite bloquant, ex. 0.9 (vide = non bloquant)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  voice-eval:
    name: Voice eval
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      VOICE_EVAL_GROQ_API_KEY: ${{ secrets.VOICE_EVAL_GROQ_API_KEY }}
      VOICE_EVAL_FILTER: ${{ github.event.inputs.filter }}
      VOICE_EVAL_TIER: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
      VOICE_EVAL_REPEAT: ${{ github.event.inputs.repeat || '1' }}
      VOICE_EVAL_MIN_PASS_RATE: ${{ github.event.inputs.min_pass_rate || vars.VOICE_EVAL_MIN_PASS_RATE }}
      VOICE_EVAL_OUTPUT_DIR: ${{ github.workspace }}/apps/api/eval-results
    steps:
      - name: Check Groq key
        id: key
        run: |
          if [ -z "$VOICE_EVAL_GROQ_API_KEY" ]; then
            echo "::warning::Secret VOICE_EVAL_GROQ_API_KEY absent : banc d'évaluation vocal ignoré."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.available == 'true'

      - name: Setup pnpm
        if: steps.key.outputs.available == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.key.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.key.outputs.available == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        if: steps.key.outputs.available == 'true'
        run: pnpm turbo build --filter=@sokar/api^...

      - name: Run voice eval
        if: steps.key.outputs.available == 'true'
        run: pnpm --filter @sokar/api eval:voice

      - name: Upload report
        if: always() && steps.key.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: voice-eval-report
          path: apps/api/eval-results/
          if-no-files-found: ignore
          retention-days: 30
