name: Deploy Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # déclenchement manuel
    inputs:
      force_smoke_failure:
        description: 'Échouer volontairement après les smoke tests pour prouver le blocage de promotion'
        required: false
        type: boolean
        default: false

# Évite les déploiements concurrents sur staging.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  deploy:
    name: Deploy to staging VPS
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_SMS_TO: ${{ secrets.ALERT_SMS_TO }}
          STRIPE_PRICE_ESSENTIAL_MONTHLY: ${{ vars.STRIPE_STAGING_ESSENTIAL_MONTHLY }}
          STRIPE_PRICE_ESSENTIAL_ANNUAL: ${{ vars.STRIPE_STAGING_ESSENTIAL_ANNUAL }}
          STRIPE_PRICE_PRO_MONTHLY: ${{ vars.STRIPE_STAGING_PRO_MONTHLY }}
          STRIPE_PRICE_PRO_ANNUAL: ${{ vars.STRIPE_STAGING_PRO_ANNUAL }}
          STRIPE_PRICE_MULTI_SITE_MONTHLY: ${{ vars.STRIPE_STAGING_MULTI_SITE_MONTHLY }}
          STRIPE_PRICE_MULTI_SITE_ANNUAL: ${{ vars.STRIPE_STAGING_MULTI_SITE_ANNUAL }}
          STRIPE_PRICE_MULTI_SITE_ADDON_MONTHLY: ${{ vars.STRIPE_STAGING_MULTI_SITE_ADDON_MONTHLY }}
          STRIPE_PRICE_MULTI_SITE_ADDON_ANNUAL: ${{ vars.STRIPE_STAGING_MULTI_SITE_ADDON_ANNUAL }}
          NEXT_PUBLIC_DEMO_RESTAURANT_ID: ${{ vars.STAGING_DEMO_RESTAURANT_ID }}
          NEXT_PUBLIC_DEMO_STAGING: '1'
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 18m
          envs: ALERT_WEBHOOK,SENTRY_DSN,ALERT_EMAIL_TO,ALERT_WEBHOOK_URL,ALERT_SMS_TO,STRIPE_PRICE_ESSENTIAL_MONTHLY,STRIPE_PRICE_ESSENTIAL_ANNUAL,STRIPE_PRICE_PRO_MONTHLY,STRIPE_PRICE_PRO_ANNUAL,STRIPE_PRICE_MULTI_SITE_MONTHLY,STRIPE_PRICE_MULTI_SITE_ANNUAL,STRIPE_PRICE_MULTI_SITE_ADDON_MONTHLY,STRIPE_PRICE_MULTI_SITE_ADDON_ANNUAL,NEXT_PUBLIC_DEMO_RESTAURANT_ID,NEXT_PUBLIC_DEMO_STAGING
          script: |
            set -euo pipefail
            cd /opt/sokar-staging
            test "${NEXT_PUBLIC_DEMO_STAGING:-}" = "1"
            [[ "${NEXT_PUBLIC_DEMO_RESTAURANT_ID:-}" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]
            git checkout main
            # Le VPS ne peut pas utiliser son helper GitHub pour le fetch HTTPS.
            # On transfère donc une archive publique du commit exact depuis
            # codeload.github.com, sans token ni clé GitHub sur le VPS, puis on
            # crée un snapshot Git local pour conserver les rollbacks/hash.
            SOURCE_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
            [[ "$SOURCE_SHA" =~ ^[[:xdigit:]]{40}$ ]]
            git reset --hard
            git clean -fd -e releases/
            SOURCE_TMP=$(mktemp -d /tmp/sokar-staging-source.XXXXXX)
            trap 'rm -rf "$SOURCE_TMP"' EXIT
            curl --fail --silent --show-error --location --retry 3 --max-time 120 \
              "https://codeload.github.com/Sshindraa/Sokar/tar.gz/${SOURCE_SHA}" \
              -o "$SOURCE_TMP/source.tar.gz"
            mkdir "$SOURCE_TMP/tree"
            tar -xzf "$SOURCE_TMP/source.tar.gz" --strip-components=1 -C "$SOURCE_TMP/tree"
            while IFS= read -r -d '' tracked_path; do
              if [ ! -e "$SOURCE_TMP/tree/$tracked_path" ] && [ ! -L "$SOURCE_TMP/tree/$tracked_path" ]; then
                rm -f -- "$tracked_path"
              fi
            done < <(git ls-files -z)
            cp -a "$SOURCE_TMP/tree/." .
            git add --all
            if ! git diff --cached --quiet; then
              git -c user.name='Sokar staging snapshot' \
                -c user.email='deploy@sokar.tech' \
                commit -m "chore(staging): snapshot ${SOURCE_SHA}"
            fi
            git status --short
            if [ ! -x /usr/local/sbin/sokar-deploy-root ]; then
              sudo install -o root -g root -m 0755 \
                scripts/ops/sokar-deploy-root.sh /usr/local/sbin/sokar-deploy-root
            fi
            if [ -n "${SENTRY_DSN:-}${ALERT_EMAIL_TO:-}${ALERT_WEBHOOK_URL:-}${ALERT_SMS_TO:-}" ]; then
              bash scripts/ops/sync-alerting-config.sh staging
            fi
            bash scripts/ops/sync-stripe-prices.sh staging
            SOKAR_SKIP_GIT_PULL=1 bash scripts/deploy.sh --env staging

  smoke-tests:
    name: Smoke tests against staging
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Curl health endpoints
        run: |
          set -euo pipefail

          STAGING_URL="https://staging.sokar.tech"
          API_STAGING_URL="https://api-staging.sokar.tech"

          echo "=== Health checks ==="

          # /health via api-staging.sokar.tech
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 "$API_STAGING_URL/health" || echo "FAIL")
          echo "api-staging.sokar.tech/health → $HEALTH_STATUS"
          [ "$HEALTH_STATUS" = "200" ] || exit 1

          # /livez via api-staging.sokar.tech
          LIVEZ_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 "$API_STAGING_URL/livez" || echo "FAIL")
          echo "api-staging.sokar.tech/livez → $LIVEZ_STATUS"
          [ "$LIVEZ_STATUS" = "200" ] || exit 1

          # /dashboard — peut rediriger vers Clerk (302) ou répondre 200.
          # On accepte 200 et 302 comme valides.
          DASH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 -L "$STAGING_URL/dashboard" || echo "FAIL")
          echo "staging.sokar.tech/dashboard → $DASH_STATUS"
          [ "$DASH_STATUS" = "200" ] || [ "$DASH_STATUS" = "302" ] || exit 1

          # Page d'accueil
          HOME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 "$STAGING_URL/" || echo "FAIL")
          echo "staging.sokar.tech/ → $HOME_STATUS"
          [ "$HOME_STATUS" = "200" ] || exit 1

          # Sokar Connect page
          CONNECT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 "$STAGING_URL/restaurant/chez-sokar-demo" || echo "FAIL")
          echo "staging.sokar.tech/restaurant/chez-sokar-demo → $CONNECT_STATUS"
          [ "$CONNECT_STATUS" = "200" ] || exit 1

          echo ""
          echo "✅ All smoke tests passed"

      - name: Test rollback staging
        if: success() && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main')
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            bash /opt/sokar-staging/scripts/deploy.sh --env staging rollback
        continue-on-error: true

      - name: Verify rollback health
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main')
        run: |
          sleep 5
          curl -fsS https://api-staging.sokar.tech/livez || exit 1

      - name: Restore current staging release
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main')
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            latest=$(tr -d '[:space:]' < /opt/sokar-staging/releases/.latest)
            test -n "$latest"
            # Le test de rollback restaure l’avant-dernière release ;
            # remettre explicitement la release courante évite de laisser
            # staging servir un artefact historique après un workflow vert.
            bash /opt/sokar-staging/scripts/deploy.sh --env staging rollback "$latest"

      - name: Playwright E2E smoke test
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @sokar/dashboard exec playwright install --with-deps chromium

      - name: Run E2E against staging
        env:
          PLAYWRIGHT_BASE_URL: https://staging.sokar.tech
        run: |
          cd apps/dashboard
          # Run only the functional E2E tests (not visual regression) against
          # the staging URL. The PLAYWRIGHT_BASE_URL env var overrides the
          # dev server baseURL in playwright.config.ts.
          pnpm exec playwright test dashboard.spec.ts widget.spec.ts --project=desktop-1440 \
            --reporter=list
          echo "Dashboard E2E smoke test completed (blocking)"

      - name: Install Connect Playwright browsers
        run: pnpm --filter @sokar/connect exec playwright install --with-deps chromium

      - name: Run Connect E2E smoke against staging
        env:
          PLAYWRIGHT_BASE_URL: https://staging.sokar.tech
          API_URL: https://api-staging.sokar.tech
        run: |
          cd apps/connect
          # La fiche publique est servie par Connect. Le widget de réservation
          # (/widget/[slug]) est servi par Dashboard et est testé juste au-dessus.
          pnpm exec playwright test restaurant-page.spec.ts --project=desktop-1280 \
            --reporter=list
          echo "Connect E2E smoke test completed (blocking)"

      - name: Intentional promotion gate failure (proof only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_smoke_failure == true }}
        run: |
          echo "Intentional staging failure requested: production promotion must remain skipped."
          exit 1
